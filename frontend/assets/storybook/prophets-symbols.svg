<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Simbol untuk kisah para nabi</title>
  <desc id="desc">Ilustrasi simbolis taman, bahtera, bulir gandum, tongkat dan laut, serta benda langit. Tidak menampilkan sosok nabi.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e8eee5"/><stop offset="1" stop-color="#f8f1dd"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#8ea9a0"/><stop offset="1" stop-color="#52766e"/></linearGradient>
    <pattern id="grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".65" fill="#8f805b" opacity=".17"/><circle cx="13" cy="13" r=".55" fill="#8f805b" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grain)"/>
  <g stroke="#b8aa86" stroke-width="2" opacity=".52"><path d="M240 45v290M480 45v290M720 45v290M960 45v290"/></g>
