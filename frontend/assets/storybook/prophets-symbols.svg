  <g transform="translate(844 0)"><path d="M16 278 91 174l72 104" fill="#b5b19a"/><path d="m56 278 35-48 33 48" fill="#e9e6d7"/><path d="M164 256c26-17 50-17 76 0v77H164z" fill="#8fa99e"/><path d="M163 256c24 17 50 17 77 0m-77 23c24 17 50 17 77 0" fill="none" stroke="#52776d" stroke-width="5"/><path d="M213 194v77" stroke="#805b3e" stroke-width="8" stroke-linecap="round"/><path d="M213 194c0-13 19-17 24-6" fill="none" stroke="#805b3e" stroke-width="8" stroke-linecap="round"/></g>
